version: 1

# ─── Tags del proyecto (aplicar en consola Amplify o vía CLI al crear/actualizar la app) ───
# aws amplify tag-resource \
#   --resource-arn <AMPLIFY_APP_ARN> \
#   --tags \
#   proyecto=IteraDORA \
#   "cliente=Itera / Preventa" \
#   "arquitectos=Cristian Guzman, Juan Pablo Molina, Andryd Ibarra" \
#   "PM=Xiomara Valencia" \
#   "Aprobador=Sebastian Sanchez"
#
# Build spec de AWS Amplify Hosting. Si existe `amplify.yml` en la raíz del repo, este archivo
# PISA los build settings guardados en la consola.
#
# IMPORTANTE: `baseDirectory` apunta a `.amplify-hosting`, que es la raíz de la especificación
# de despliegue de Amplify. Tiene que contener `static/`, `compute/default/` y
# `deploy-manifest.json`. NO apuntar a `.amplify-hosting/compute/default`: ese directorio no
# tiene `index.html` en la raíz y Amplify responde "not found" en toda la página.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # `astro build` genera dist/client (estático) y dist/server (SSR).
        # Las variables que el compute necesita en runtime se hornean en el paso siguiente.
        - npm run build
        # Arma .amplify-hosting/: static/ + compute/default/ + deploy-manifest.json. Su
        # `server.mjs` fija PORT/HOST y hornea LAMBDA_FUNCTION_URL antes de importar a Astro.
        # Si falta una variable obligatoria, el build falla acá y no llega a producción como 503.
        - node scripts/build-amplify.mjs
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*